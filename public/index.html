<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101a28">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: auto; padding: 40px 22px; }
    h1 { font-size: 36px; }
    p { line-height: 1.7; color: #bfd0e5; }
    form, li { padding: 20px; border: 1px solid #51667c;
      border-radius: 14px; background: #1a2a3d; margin-bottom: 16px; }
    label { display: block; margin-bottom: 16px; }
    input, textarea { display: block; box-sizing: border-box; width: 100%;
      margin-top: 6px; padding: 12px; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { padding: 10px 16px; margin: 4px; cursor: pointer;
      font: inherit; }
    button:disabled { cursor: wait; opacity: .6; }
    ul { list-style: none; padding: 0; display: grid; gap: 12px; }
    li strong { display: block; margin-bottom: 8px; }
    li span { display: block; white-space: pre-wrap;
      overflow-wrap: anywhere; margin-bottom: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p>BYTE BACK · 12단계</p>
    <h1>자료실</h1>
    <p id="account" role="status">로그인 상태를 확인하는 중입니다.</p>
<section id="device-panel" aria-labelledby="device-heading">
  <h2 id="device-heading">기기 승인</h2>
  <p id="device-status" role="status" aria-live="polite">
    기기 등록 여부를 아직 확인하지 않았습니다.
  </p>
  <p>앱 설치와 기기 승인은 별도입니다. 서버의 등록 확인이 필요합니다.</p>
  <button id="device-request" type="button" disabled>
    기기 승인 요청
  </button>
  <button id="device-refresh" type="button" disabled>
    승인 상태 다시 확인
  </button>
</section>

<p id="network-status" role="status" aria-live="polite">
  오프라인에서는 로그인과 기기 승인, 자료 조회를 할 수 없습니다.
  인터넷 연결 후 다시 시도하세요.
</p>

    <form id="auth-form" hidden>
      <label>이메일
        <input id="email" type="email" autocomplete="username"
          required maxlength="254">
      </label>
      <label>비밀번호
        <input id="password" type="password"
          autocomplete="current-password" required minlength="8">
      </label>
      <button type="submit">로그인</button>
      <button id="signup" type="button">회원가입</button>
    </form>

    <button id="logout" type="button" hidden>로그아웃</button>
    <p id="message" role="status" aria-live="polite"></p>

    <form id="note-form" hidden>
      <h2 id="editor-title">새 메모</h2>
      <label>제목
        <input id="note-title" required maxlength="200">
      </label>
      <label>내용
        <textarea id="note-content" required maxlength="20000"></textarea>
      </label>
      <button type="submit">저장</button>
      <button id="cancel-edit" type="button">작성 취소</button>
    </form>

    <ul id="notes" aria-live="polite"></ul>

<section id="operations-panel" hidden>
  <h2>탈환 작전실</h2>
  <div id="operations-root"></div>
</section>
</main>
  <script src="./vendor/webauthn-browser.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
