<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: auto; padding: 40px 22px; }
    h1 { font-size: 36px; }
    p { line-height: 1.7; color: #bfd0e5; }
    form, li { padding: 20px; border: 1px solid #51667c;
      border-radius: 14px; background: #1a2a3d; margin-bottom: 16px; }
    label { display: block; margin-bottom: 16px; }
    input, textarea { display: block; box-sizing: border-box; width: 100%;
      margin-top: 6px; padding: 12px; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { padding: 10px 16px; margin: 4px; cursor: pointer;
      font: inherit; }
    button:disabled { cursor: wait; opacity: .6; }
    ul { list-style: none; padding: 0; display: grid; gap: 12px; }
    li strong { display: block; margin-bottom: 8px; }
    li span { display: block; white-space: pre-wrap;
      overflow-wrap: anywhere; margin-bottom: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p>BYTE BACK · 3단계</p>
    <h1>자료실</h1>
    <p id="account" role="status">로그인 상태를 확인하는 중입니다.</p>

    <form id="auth-form" hidden>
      <label>이메일
        <input id="email" type="email" autocomplete="username"
          required maxlength="254">
      </label>
      <label>비밀번호
        <input id="password" type="password"
          autocomplete="current-password" required minlength="8">
      </label>
      <button type="submit">로그인</button>
      <button id="signup" type="button">회원가입</button>
    </form>

    <button id="logout" type="button" hidden>로그아웃</button>
    <p id="message" role="status" aria-live="polite"></p>

    <form id="note-form" hidden>
      <h2 id="editor-title">새 메모</h2>
      <label>제목
        <input id="note-title" required maxlength="200">
      </label>
      <label>내용
        <textarea id="note-content" required maxlength="20000"></textarea>
      </label>
      <button type="submit">저장</button>
      <button id="cancel-edit" type="button">작성 취소</button>
    </form>

    <ul id="notes" aria-live="polite"></ul>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
